name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          sed -i '' -E 's/#define LICECAP_VERSION "v1\.32"/#define LICECAP_VERSION "${GITHUB_REF_NAME}"/' licecap/licecap_version.h
          grep -F "#define LICECAP_VERSION \"$GITHUB_REF_NAME\"" licecap/licecap_version.h

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project licecap/licecap.xcodeproj \
            -configuration Release \
            -target licecap \
            build

      - name: Package
        run: |
          set -euo pipefail
          app=$(find build -type d -name 'licecap.app' -print -quit)
          test -n "$app"
          test -d "$app"
          zip_name="LICEcap-macOS.zip"
          ditto -c -k --keepParent "$app" "$zip_name"
          shasum -a 256 "$zip_name" > "$zip_name.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: LICEcap-macOS
          path: |
            LICEcap-macOS.zip
            LICEcap-macOS.zip.sha256
          if-no-files-found: error

  windows:
    strategy:
      matrix:
        include:
          - platform: x64
            artifact: LICEcap-Windows-x64
          - platform: Win32
            artifact: LICEcap-Windows-x86
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $file = "licecap\licecap_version.h"
          (Get-Content $file) `
            -replace '#define LICECAP_VERSION "v1\.32"', "#define LICECAP_VERSION `"$env:GITHUB_REF_NAME`"" |
            Set-Content $file

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild licecap\licecap\licecap.vcxproj /m /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:PlatformToolset=v143

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem -Path . -Filter LICEcap.exe -Recurse |
            Where-Object { $_.FullName -notmatch '\\(Debug_new|Debug|arm64)\\' } |
            Select-Object -First 1
          if (-not $exe) { throw "Built LICEcap.exe not found." }
          $artifact = "${{ matrix.artifact }}"
          Compress-Archive -Path $exe.FullName -DestinationPath "$artifact.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "$artifact.zip").Hash.ToLower()
          "$hash  $artifact.zip" | Out-File -NoNewline -Encoding ascii "$artifact.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          {
            echo "## LICEcap v$version"
            echo
            echo "本版本包含未签名的 macOS 与 Windows 构建产物。"
            echo
            echo "### 校验值"
            echo '```text'
            cat *.sha256
            echo '```'
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "LICEcap $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            LICEcap-macOS.zip \
            LICEcap-macOS.zip.sha256 \
            LICEcap-Windows-x64.zip \
            LICEcap-Windows-x64.zip.sha256 \
            LICEcap-Windows-x86.zip \
            LICEcap-Windows-x86.zip.sha256
        env:
          GH_TOKEN: ${{ github.token }}
